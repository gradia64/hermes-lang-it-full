        body: "{0} sta limitando le richieste in questo momento. Attendi un minuto e riprova."
        title: Il servizio di IA è occupato
      server_error:
        body: "{0} ha restituito un errore del server. Riprova tra poco o cambia provider."
        title: Il servizio di IA ha riscontrato un problema
