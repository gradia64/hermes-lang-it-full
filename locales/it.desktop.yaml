        body: Un firewall o una CDN davanti a {0} ha bloccato la richiesta prima che arrivasse al modello; probabilmente la tua chiave va bene. Definisci un header User-Agent tramite gli extra_headers del provider in Impostazioni oppure cambia provider e reinvia il messaggio.
