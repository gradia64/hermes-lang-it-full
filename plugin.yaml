# NOTE: `hermes-lang-it` on the plugin catalog is taken (Lazzdaycod/hermes-lang-it).
# Pick the final id before publishing — see README.
name: hermes-lang-it
version: 0.1.0
description: >-
  Italian (Italiano) Desktop language pack for Hermes Agent, generated from a
  hand-reviewed typed catalog (full coverage incl. firstRun, themePicker and
  function-backed keys as positional {0} templates). Core and TUI keep the
  Italian catalogs already bundled with Hermes. Manifest-only plugin: no code,
  no network, no env. Registering the pack never changes display.language; the
  user opts in via `hermes config set display.language it`.
provides_locales:
  - id: it
    endonym: Italiano
    rtl: false
